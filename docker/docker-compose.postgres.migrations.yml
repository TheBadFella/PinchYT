name: pinchyt-postgres-migrations

services:
  phx:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
      args:
        DATABASE_ADAPTER: postgres
    environment:
      DATABASE_ADAPTER: postgres
      DATABASE_URL: ecto://postgres:postgres@postgres/pinchflat_migrations_test
      MIX_ENV: test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - '..:/app'
      - '/app/deps'
      - '/app/_build'
    command: tail -F /dev/null

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pinchflat_migrations_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pinchflat_migrations_test']
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql

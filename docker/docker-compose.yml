name: pinchyt

services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    profiles: ["pot-provider"]
    restart: unless-stopped
    # The provider is intentionally internal-only. Do not add a ports mapping.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require("http").get("http://127.0.0.1:4416/ping", response =>
          process.exit(response.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3

  phx:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    volumes:
      - '..:/app'
      - mix_deps:/app/deps
      - mix_build:/app/_build
      - root_node_modules:/app/node_modules
      - assets_node_modules:/app/assets/node_modules
    ports:
      - '4000:4008'
    command: bash -c "chmod +x docker/docker-run.dev.sh && docker/docker-run.dev.sh"
    stdin_open: true
    tty: true
    environment:
      PAGINATION_HISTORY_LIMIT: 10
      PAGINATION_LIMIT: 20
      # Leave YT_DLP_*_WORKER_CONCURRENCY unset to control workers in Settings.
      # If you set them here they override the UI until you remove them.

volumes:
  mix_deps:
  mix_build:
  root_node_modules:
  assets_node_modules:

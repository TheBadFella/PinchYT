version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Regina"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"

  - package-ecosystem: "mix"
    directory: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/assets"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"

  - package-ecosystem: "docker"
    directory: "/docker"
    groups:
      dependencies:
        patterns:
          - "*"
    rebase-strategy: "auto"
